<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized tender discovery workflow</title>
  <desc id="desc">High-level public-safe diagram showing tender discovery, source-specific retrieval, metadata normalization, document validation, and handoff to RFP analysis.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .box { fill: #eef6f8; stroke: #0f7890; stroke-width: 2; rx: 12; }
      .box2 { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 12; }
      .box3 { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 12; }
      .text { font-family: Inter, Arial, sans-serif; fill: #0f172a; font-size: 20px; font-weight: 700; }
      .small { font-family: Inter, Arial, sans-serif; fill: #334155; font-size: 15px; }
      .caption { font-family: Inter, Arial, sans-serif; fill: #475569; font-size: 14px; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
  </defs>
  <rect class="bg" width="1200" height="420"/>
  <text class="text" x="50" y="54">Tender Discovery and Document Retrieval</text>
  <text class="caption" x="50" y="82">Public-safe view: no private endpoints, credentials, table names, customer names, or operational node labels.</text>
  <rect class="lane" x="40" y="115" width="1120" height="235"/>
  <rect class="box" x="75" y="175" width="170" height="88"/>
  <text class="text" x="101" y="211">Search Profile</text>
  <text class="small" x="101" y="238">Relevant IT tenders</text>
  <path class="arrow" d="M245 219 H310"/>
  <rect class="box" x="315" y="145" width="175" height="70"/>
  <text class="text" x="342" y="178">Structured</text>
  <text class="small" x="342" y="199">Notice sources</text>
  <rect class="box2" x="315" y="245" width="175" height="70"/>
  <text class="text" x="342" y="278">Portal Flow</text>
  <text class="small" x="342" y="299">Browser/session path</text>
  <path class="arrow" d="M490 180 H565"/>
  <path class="arrow" d="M490 280 H565"/>
  <rect class="box3" x="570" y="175" width="180" height="88"/>
  <text class="text" x="596" y="211">Normalize</text>
  <text class="small" x="596" y="238">Buyer, title, dates</text>
  <path class="arrow" d="M750 219 H815"/>
  <rect class="box2" x="820" y="175" width="180" height="88"/>
  <text class="text" x="848" y="211">Validate</text>
  <text class="small" x="848" y="238">Document targets</text>
  <path class="arrow" d="M1000 219 H1065"/>
  <rect class="box" x="1070" y="175" width="55" height="88"/>
  <text class="text" x="1086" y="211">RFP</text>
  <text class="small" x="1084" y="238">handoff</text>
  <text class="caption" x="75" y="375">Manual review is the preferred outcome when a source cannot be resolved safely or confidently.</text>
</svg>
