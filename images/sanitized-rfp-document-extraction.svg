<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized RFP document extraction workflow</title>
  <desc id="desc">High-level public-safe diagram showing document ingestion, classification, chunking, requirement extraction, and structured review rows.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #0f7890; stroke-width: 2; rx: 12; }
      .data { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .review { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; rx: 12; }
      .text { font-family: Inter, Arial, sans-serif; fill: #0f172a; font-size: 20px; font-weight: 700; }
      .small { font-family: Inter, Arial, sans-serif; fill: #334155; font-size: 15px; }
      .caption { font-family: Inter, Arial, sans-serif; fill: #475569; font-size: 14px; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
  </defs>
  <rect class="bg" width="1200" height="420"/>
  <text class="text" x="50" y="54">RFP Document Classification and Extraction</text>
  <text class="caption" x="50" y="82">Public-safe view of the document-intelligence pipeline without internal workflow node names or infrastructure details.</text>
  <rect class="box" x="70" y="165" width="160" height="90"/>
  <text class="text" x="99" y="201">Ingest</text>
  <text class="small" x="99" y="229">PDFs and files</text>
  <path class="arrow" d="M230 210 H295"/>
  <rect class="box" x="300" y="165" width="170" height="90"/>
  <text class="text" x="329" y="201">Extract Text</text>
  <text class="small" x="329" y="229">Normalize payload</text>
  <path class="arrow" d="M470 210 H535"/>
  <rect class="data" x="540" y="165" width="170" height="90"/>
  <text class="text" x="568" y="201">Classify</text>
  <text class="small" x="568" y="229">SOW, SLA, pricing</text>
  <path class="arrow" d="M710 210 H775"/>
  <rect class="data" x="780" y="165" width="160" height="90"/>
  <text class="text" x="810" y="201">Chunk</text>
  <text class="small" x="810" y="229">Sections and facts</text>
  <path class="arrow" d="M940 210 H1005"/>
  <rect class="review" x="1010" y="145" width="150" height="130"/>
  <text class="text" x="1034" y="184">Review Rows</text>
  <text class="small" x="1034" y="213">Requirements</text>
  <text class="small" x="1034" y="236">Questions</text>
  <text class="small" x="1034" y="259">Risks</text>
  <text class="caption" x="70" y="335">The output is structured and reviewable. It is not treated as final bid language until checked by a human.</text>
</svg>
